%YAML:1.0
# Values requiring mechanical calibration are deliberately versioned here.
expected_collectibles: 0 # Set only when the field inventory is known.
min_confidence: 0.55
collector_percent: -100 # Installed motor: negative is the collecting direction.
collect_bottom_y: 0.82
home_dock_bottom_y: 0.86
obstacle_bottom_y: 0.36
cruise_mps: 0.35
final_approach_mps: 0.18
search_yaw_radps: 0.75
target_center_x: 0.51 # Calibrated collector centreline in image coordinates.
alignment_deadband: 0.035
target_filter_alpha: 0.45
target_jump_threshold: 0.16
collect_forward_m: 0.15 # From collector intake; used with a calibrated ground point.
home_dock_forward_m: 0.18
ground_lateral_deadband_m: 0.045
ground_turn_in_place_bearing_rad: 0.26
ground_steering_gain: 2.60
ground_forward_kp: 0.80
ground_forward_ki: 0.04
ground_forward_kd: 0.08
ground_lateral_kp: 1.10
ground_lateral_ki: 0.03
ground_lateral_kd: 0.06
ground_yaw_ki: 0.03
ground_yaw_kd: 0.08
ground_integral_limit_m_s: 0.25
ground_max_lateral_mps: 0.20
ground_yaw_deadband_rad: 0.035
ground_advance_lateral_m: 0.065 # No forward motion beyond this lateral miss.
ground_advance_bearing_rad: 0.13 # Approximately 7.5 degrees.
target_bearing_jump_rad: 0.40 # Keep lock unless a detection moves this far in bearing.
steering_gain: 2.60
max_yaw_radps: 1.80
turn_in_place_error: 0.22
dump_servo_pulse_us: 2000 # Confirm this direction on the physical robot.
stow_servo_pulse_us: 1600 # Confirm this direction on the physical robot.
